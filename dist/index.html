
  <!DOCTYPE html>
  <html lang="fr">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
      <title>LocaHub — Gestion locative France &amp; Canada</title>
      <meta name="description" content="Centralizes tenant and landlord needs with smart property search, social interactions, seamless applications, payments, and full rental management." />
      <meta name="robots" content="noindex, nofollow" />
      <link rel="manifest" href="/manifest.webmanifest" />
      <link rel="icon" href="/icon.svg" type="image/svg+xml" />
      <link rel="apple-touch-icon" href="/icon.svg" />
      <meta name="theme-color" content="#60a5fa" />
      <meta name="mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="default" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      
      <script type="module" crossorigin src="/assets/index-BcQRDjlh.js"></script>
      <link rel="stylesheet" crossorigin href="/assets/index-Ch0Wre5y.css">
    </head>

    <body>
      
      <!--
        Écran de secours peint par le navigateur, sans JavaScript.
        React le remplace au montage. S'il reste affiché, c'est que le module
        principal n'a jamais été évalué : bundle en 404, erreur de syntaxe,
        ou exception au chargement d'un module. Plus jamais de page blanche muette.
      -->
      <div id="root">
        <div id="boot-fallback" style="font-family: system-ui, sans-serif; max-width: 34rem; margin: 12vh auto; padding: 0 1.5rem; color: #1a1a2e;">
          <div style="width: 2.75rem; height: 2.75rem; border-radius: 0.75rem; background: #60a5fa; display: grid; place-items: center; color: #fff; font-weight: 700; margin-bottom: 1.25rem;">LH</div>
          <p id="boot-status" style="font-size: 0.95rem; color: #64748b;">Chargement de LocaHub…</p>
          <pre id="boot-error" style="display: none; margin-top: 1rem; padding: 0.875rem; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.75rem; font-size: 0.75rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word;"></pre>
          <div id="boot-actions" style="display: none; margin-top: 1.25rem; display: none; gap: 0.5rem; flex-wrap: wrap;">
            <button id="boot-reload" style="height: 3rem; padding: 0 1.25rem; border-radius: 0.75rem; border: 0; background: #60a5fa; color: #fff; font-size: 0.9rem; font-weight: 600; cursor: pointer;">Recharger</button>
            <button id="boot-reset" style="height: 3rem; padding: 0 1.25rem; border-radius: 0.75rem; border: 1px solid #e2e8f0; background: #fff; color: #1a1a2e; font-size: 0.9rem; cursor: pointer;">Vider le cache et réinitialiser</button>
          </div>
        </div>
      </div>

      <script>
        /*
         * Filet de sécurité au démarrage.
         * Capture les erreurs survenues AVANT que React ne monte — celles que
         * l'ErrorBoundary ne peut par définition pas intercepter.
         */
        (function () {
          var shown = false;
          function show(message) {
            if (shown) return;
            var root = document.getElementById("boot-fallback");
            if (!root) return; // React a monté : plus rien à afficher
            shown = true;
            document.getElementById("boot-status").textContent = "L'application n'a pas pu démarrer.";
            var pre = document.getElementById("boot-error");
            pre.style.display = "block";
            pre.textContent = String(message);
            var actions = document.getElementById("boot-actions");
            actions.style.display = "flex";
          }

          window.addEventListener("error", function (e) {
            show((e.error && (e.error.stack || e.error.message)) || e.message);
          });
          window.addEventListener("unhandledrejection", function (e) {
            show((e.reason && (e.reason.stack || e.reason.message)) || e.reason);
          });

          // Si rien n'a monté au bout de 8 s, c'est que le bundle n'arrive pas
          setTimeout(function () {
            if (document.getElementById("boot-fallback")) {
              show("Délai dépassé : le script principal n'a pas été exécuté. Vérifiez l'onglet Réseau (fichier .js en 404 ?) et le service worker.");
            }
          }, 8000);

          document.addEventListener("click", function (e) {
            var id = e.target && e.target.id;
            if (id === "boot-reload") location.reload();
            if (id === "boot-reset") {
              var done = function () { location.reload(); };
              try {
                Object.keys(localStorage).forEach(function (k) {
                  if (k.indexOf("locahub.") === 0) localStorage.removeItem(k);
                });
              } catch (err) {}
              if ("serviceWorker" in navigator) {
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister(); }));
                }).then(function () {
                  return caches && caches.keys ? caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                  }) : null;
                }).then(done, done);
              } else done();
            }
          });
        })();
      </script>
      
    </body>
  </html>
